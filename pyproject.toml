[project]
name = "42-call-me-maybe"
version = "0.1.0"
description = "Function calling with LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flake8>=7.3.0",
    "llm-sdk",
    "mypy>=1.19.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

[tool.mypy]
mypy_path = ["src", "llm_sdk"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
